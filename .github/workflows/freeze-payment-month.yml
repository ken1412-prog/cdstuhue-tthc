name: Freeze approved payment month
on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Kỳ muốn chốt (YYYY-MM), chỉ thực hiện khi chủ sở hữu đã yêu cầu'
        required: true
        type: string
      confirmation:
        description: 'Nhập chính xác CHOT YYYY-MM để xác nhận'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: payment-month-freeze
  cancel-in-progress: false
jobs:
  close-month:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Freeze only the approved public previous month
        env:
          CLOSE_PERIOD: ${{ inputs.period }}
          CLOSE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CLOSE_CONFIRMATION" = "CHOT $CLOSE_PERIOD"
          python scripts/freeze_payment_month.py --close-period "$CLOSE_PERIOD" --confirm "$CLOSE_CONFIRMATION"
      - name: Commit the immutable monthly archive if present
        run: |
          if [ -n "$(git status --porcelain -- site/data/payment-history.json site/data/payment-history/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/payment-history.json site/data/payment-history/
            git commit -m "Freeze approved public payment month"
            git push origin HEAD:main
          else
            echo "No new approved month to freeze."
          fi
