name: Publish CDSTUHUE website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'   # every two hours (UTC)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Fetch licensed high-resolution Huế photographs
        run: |
          set -euo pipefail
          mkdir -p site/assets/img
          fetch_photo() {
            local destination="$1" thumbnail="$2" original="$3"
            if [ ! -s "$destination" ]; then
              curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
                --connect-timeout 20 --max-time 90 \
                --user-agent 'CDSTUHUE/1.0 (https://github.com/ken1412-prog/cdstuhue-tthc)' \
                --output "$destination" "$thumbnail" || {
                  rm -f "$destination"
                  curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
                    --connect-timeout 20 --max-time 120 \
                    --user-agent 'CDSTUHUE/1.0 (https://github.com/ken1412-prog/cdstuhue-tthc)' \
                    --output "$destination" "$original"
                }
            fi
            test -s "$destination"
            test "$(file --brief --mime-type "$destination")" = 'image/jpeg'
            echo "Verified $(basename "$destination") ($(wc -c < "$destination") bytes)"
          }
          fetch_photo site/assets/img/hue-downtown-2560.jpg \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/View_of_Downtown_Hue_%28I%29.jpg/2560px-View_of_Downtown_Hue_%28I%29.jpg' \
            'https://upload.wikimedia.org/wikipedia/commons/9/93/View_of_Downtown_Hue_%28I%29.jpg'
          fetch_photo site/assets/img/nguyen-hoang-bridge-3840.jpg \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/C%E1%BA%A7u_Nguy%E1%BB%85n_Ho%C3%A0ng_2025-04-27.jpg/3840px-C%E1%BA%A7u_Nguy%E1%BB%85n_Ho%C3%A0ng_2025-04-27.jpg' \
            'https://upload.wikimedia.org/wikipedia/commons/1/15/C%E1%BA%A7u_Nguy%E1%BB%85n_Ho%C3%A0ng_2025-04-27.jpg'
          git add site/assets/img/hue-downtown-2560.jpg site/assets/img/nguyen-hoang-bridge-3840.jpg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add licensed high-resolution Huế landscape photographs'
            git push origin HEAD:main
          fi
      - name: Export reviewed public Q&A from Google Sheets
        env:
          QA_PUBLIC_ENDPOINT: ${{ secrets.QA_PUBLIC_ENDPOINT }}
        run: |
          if [ -n "$QA_PUBLIC_ENDPOINT" ]; then
            python scripts/sync_public.py
          else
            echo "QA_PUBLIC_ENDPOINT not configured: publishing empty approved.json placeholder"
          fi
      - name: Validate dashboard assets
        run: |
          python -m json.tool site/data/approved.json > /dev/null
          python -m json.tool site/data/progress.json > /dev/null
          python -m json.tool site/data/finance.json > /dev/null
          python -m json.tool site/data/stats.json > /dev/null
          python -m json.tool site/data/menu.json > /dev/null
          node --check site/assets/app.js
          node tests/test_ca_qs_stats.js
          python -m unittest discover -s tests -p 'test_public_surface.py' -v
          python -m unittest discover -s tests -p 'test_payment_month.py' -v
          test -s site/index.html
          test -s site/hoi-dap.html
          test -s site/assets/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
