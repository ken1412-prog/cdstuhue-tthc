name: Publish CDSTUHUE website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'   # every two hours (UTC)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Fetch licensed high-resolution Huế photographs
        run: |
          set -euo pipefail
          mkdir -p site/assets/img
          fetch_photo() {
            local destination="$1" thumbnail="$2" original="$3"
            if [ ! -s "$destination" ]; then
              curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
                --connect-timeout 20 --max-time 90 \
                --user-agent 'CDSTUHUE/1.0 (https://github.com/ken1412-prog/cdstuhue-tthc)' \
                --output "$destination" "$thumbnail" || {
                  rm -f "$destination"
                  curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
                    --connect-timeout 20 --max-time 120 \
                    --user-agent 'CDSTUHUE/1.0 (https://github.com/ken1412-prog/cdstuhue-tthc)' \
                    --output "$destination" "$original"
                }
            fi
            test -s "$destination"
            test "$(file --brief --mime-type "$destination")" = 'image/jpeg'
            echo "Verified $(basename "$destination") ($(wc -c < "$destination") bytes)"
          }
          fetch_photo site/assets/img/hue-downtown-2560.jpg \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/View_of_Downtown_Hue_%28I%29.jpg/2560px-View_of_Downtown_Hue_%28I%29.jpg' \
            'https://upload.wikimedia.org/wikipedia/commons/9/93/View_of_Downtown_Hue_%28I%29.jpg'
          fetch_photo site/assets/img/nguyen-hoang-bridge-3840.jpg \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/C%E1%BA%A7u_Nguy%E1%BB%85n_Ho%C3%A0ng_2025-04-27.jpg/3840px-C%E1%BA%A7u_Nguy%E1%BB%85n_Ho%C3%A0ng_2025-04-27.jpg' \
            'https://upload.wikimedia.org/wikipedia/commons/1/15/C%E1%BA%A7u_Nguy%E1%BB%85n_Ho%C3%A0ng_2025-04-27.jpg'
          # Downloaded Commons originals can exceed 10 MB. Keep the real photos,
          # but create web-sized JPEGs and commit only when optimization is needed.
          if [ "$(wc -c < site/assets/img/hue-downtown-2560.jpg)" -gt 2000000 ] || \
             [ "$(wc -c < site/assets/img/nguyen-hoang-bridge-3840.jpg)" -gt 2000000 ]; then
            python -m pip install --quiet --disable-pip-version-check Pillow
            python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name, max_width in (
              ('hue-downtown-2560.jpg',2560),
              ('nguyen-hoang-bridge-3840.jpg',3840)):
              path=Path('site/assets/img')/name
              if path.stat().st_size<=2000000: continue
              with Image.open(path) as source:
                  picture=source.convert('RGB')
                  if picture.width>max_width:
                      new_height=round(picture.height*max_width/picture.width)
                      picture=picture.resize((max_width,new_height),Image.Resampling.LANCZOS)
                  picture.save(path,'JPEG',quality=86,optimize=True,progressive=True)
              print('Optimized',path,round(path.stat().st_size/1024),'KiB')
          PY
          fi
          git add site/assets/img/hue-downtown-2560.jpg site/assets/img/nguyen-hoang-bridge-3840.jpg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add licensed high-resolution Huế landscape photographs'
            git push origin HEAD:main
          fi
      - name: Export reviewed public Q&A from Google Sheets
        env:
          QA_PUBLIC_ENDPOINT: ${{ secrets.QA_PUBLIC_ENDPOINT }}
        run: |
          if [ -n "$QA_PUBLIC_ENDPOINT" ]; then
            python scripts/sync_public.py
          else
            echo "QA_PUBLIC_ENDPOINT not configured: publishing empty approved.json placeholder"
          fi
      - name: Configure anonymous online counter
        env:
          QA_PUBLIC_ENDPOINT: ${{ secrets.QA_PUBLIC_ENDPOINT }}
        run: python scripts/build_online_config.py
      - name: Validate dashboard assets
        run: |
          python -m json.tool site/data/approved.json > /dev/null
          python -m json.tool site/data/progress.json > /dev/null
          python -m json.tool site/data/finance.json > /dev/null
          python -m json.tool site/data/stats.json > /dev/null
          python -m json.tool site/data/menu.json > /dev/null
          python -m json.tool site/data/online-config.json > /dev/null
          node --check site/assets/app.js
          node --check < apps-script/ExcelIntake.gs
          node --check < apps-script/Code.gs
          node --check < apps-script/CDSTUHUE_DEPLOY_SINGLE.gs
          node tests/test_excel_intake.js
          node --check < apps-script/admin-portal/AdminPortal.gs
          node --check site/assets/admin-launcher.js
          node tests/test_admin_portal.js
          node tests/test_admin_promotion.js
          node tests/test_online_presence.js
          node tests/test_live_stats_feed.js
          node tests/test_mobile_auto_refresh.js
          node tests/test_ca_qs_stats.js
          node tests/test_payment_popup.js
          python -m unittest discover -s tests -p 'test_public_surface.py' -v
          python -m unittest discover -s tests -p 'test_payment_month.py' -v
          test -s site/index.html
          test -s site/hoi-dap.html
          test -s site/assets/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
