<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 176"><title>Sơ đồ hướng dẫn thu nộp đảng phí</title><desc>Đăng nhập, kê khai, chờ phê duyệt, thanh toán, tải biên lai. Sơ đồ minh họa không phải ảnh chụp màn hình.</desc><rect width="1020" height="176" rx="14" fill="#f0f6fc"/><g transform="translate(16,24)"><rect width="184" height="128" rx="16" fill="#ffffff" stroke="#c2d5e5"/><circle cx="28" cy="30" r="19" fill="#214b76"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">01</text><text x="12" y="78" font-family="Arial" font-size="18" font-weight="bold" fill="#193953">Đăng nhập</text><text x="12" y="104" font-family="Arial" font-size="13" fill="#536c86">VNeID</text></g><g transform="translate(218,24)"><rect width="184" height="128" rx="16" fill="#ffffff" stroke="#c2d5e5"/><circle cx="28" cy="30" r="19" fill="#214b76"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">02</text><text x="12" y="78" font-family="Arial" font-size="18" font-weight="bold" fill="#193953">Kê khai</text><text x="12" y="104" font-family="Arial" font-size="13" fill="#536c86">Nộp hồ sơ</text></g><g transform="translate(420,24)"><rect width="184" height="128" rx="16" fill="#ffffff" stroke="#c2d5e5"/><circle cx="28" cy="30" r="19" fill="#a82839"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">03</text><text x="12" y="78" font-family="Arial" font-size="18" font-weight="bold" fill="#193953">Chờ duyệt</text><text x="12" y="104" font-family="Arial" font-size="13" fill="#536c86">Chi bộ</text></g><g transform="translate(622,24)"><rect width="184" height="128" rx="16" fill="#ffffff" stroke="#c2d5e5"/><circle cx="28" cy="30" r="19" fill="#214b76"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">04</text><text x="12" y="78" font-family="Arial" font-size="18" font-weight="bold" fill="#193953">Thanh toán</text><text x="12" y="104" font-family="Arial" font-size="13" fill="#536c86">QR / Ngân hàng</text></g><g transform="translate(824,24)"><rect width="184" height="128" rx="16" fill="#ffffff" stroke="#c2d5e5"/><circle cx="28" cy="30" r="19" fill="#214b76"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">05</text><text x="12" y="78" font-family="Arial" font-size="18" font-weight="bold" fill="#193953">Biên lai</text><text x="12" y="104" font-family="Arial" font-size="13" fill="#536c86">Đối chiếu</text></g></svg>
