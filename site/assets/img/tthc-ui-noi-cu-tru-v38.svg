<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-label="Lấy ý kiến nơi cư trú — vị trí các nút quan trọng"><rect width="1280" height="500" fill="#edf4f7" rx="22"/><rect x="0" y="0" width="1280" height="65" rx="20" fill="#1b4b6b"/><text x="33" y="42" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#fff">Lấy ý kiến nơi cư trú — vị trí các nút quan trọng</text><rect x="39" y="95" width="388.6666666666667" height="318" rx="14" fill="#fff" stroke="#bdd4e0" stroke-width="2"/><rect x="39" y="95" width="388.6666666666667" height="47" rx="14" fill="#e1f0f5"/><text x="56" y="126" font-family="Arial,sans-serif" font-size="20" fill="#173a56" font-weight="bold">Chi bộ nơi công tác</text><rect x="53" y="174" rx="8" width="360.6666666666667" height="48" fill="#f3f7fa" stroke="#dae7ed"/><text x="65" y="203" font-family="Arial,sans-serif" font-size="18" fill="#30586f" font-weight="normal">Quản lý Đảng viên</text><rect x="53" y="230" rx="8" width="360.6666666666667" height="42" fill="#fff1d6" stroke="#e2a345"/><text x="65" y="259" font-family="Arial,sans-serif" font-size="18" fill="#99520c" font-weight="bold">Lập danh sách lấy ý kiến</text><rect x="53" y="280" rx="8" width="360.6666666666667" height="48" fill="#f3f7fa" stroke="#dae7ed"/><text x="65" y="309" font-family="Arial,sans-serif" font-size="18" fill="#30586f" font-weight="normal">Lập danh sách (n)</text><path d="M 432.6666666666667 260 h 11 m -7 -8 l 8 8 -8 8" stroke="#d6a05b" stroke-width="3" fill="none"/><rect x="445.6666666666667" y="95" width="388.6666666666667" height="318" rx="14" fill="#fff" stroke="#bdd4e0" stroke-width="2"/><rect x="445.6666666666667" y="95" width="388.6666666666667" height="47" rx="14" fill="#e1f0f5"/><text x="462.6666666666667" y="126" font-family="Arial,sans-serif" font-size="20" fill="#173a56" font-weight="bold">Trình danh sách</text><rect x="459.6666666666667" y="174" rx="8" width="360.6666666666667" height="48" fill="#f3f7fa" stroke="#dae7ed"/><text x="471.6666666666667" y="203" font-family="Arial,sans-serif" font-size="18" fill="#30586f" font-weight="normal">Kiểm tra người đã chọn</text><rect x="459.6666666666667" y="230" rx="8" width="360.6666666666667" height="42" fill="#fff1d6" stroke="#e2a345"/><text x="471.6666666666667" y="259" font-family="Arial,sans-serif" font-size="18" fill="#99520c" font-weight="bold">Lập danh sách và trình</text><rect x="459.6666666666667" y="280" rx="8" width="360.6666666666667" height="48" fill="#fff1d6" stroke="#e2a345"/><text x="471.6666666666667" y="309" font-family="Arial,sans-serif" font-size="18" fill="#99520c" font-weight="bold">Phê duyệt danh sách</text><path d="M 839.3333333333334 260 h 11 m -7 -8 l 8 8 -8 8" stroke="#d6a05b" stroke-width="3" fill="none"/><rect x="852.3333333333334" y="95" width="388.6666666666667" height="318" rx="14" fill="#fff" stroke="#bdd4e0" stroke-width="2"/><rect x="852.3333333333334" y="95" width="388.6666666666667" height="47" rx="14" fill="#e1f0f5"/><text x="869.3333333333334" y="126" font-family="Arial,sans-serif" font-size="20" fill="#173a56" font-weight="bold">Chi bộ nơi cư trú</text><rect x="866.3333333333334" y="174" rx="8" width="360.6666666666667" height="48" fill="#f3f7fa" stroke="#dae7ed"/><text x="878.3333333333334" y="203" font-family="Arial,sans-serif" font-size="18" fill="#30586f" font-weight="normal">Chờ xử lý → Xử lý hồ sơ</text><rect x="866.3333333333334" y="230" rx="8" width="360.6666666666667" height="42" fill="#f3f7fa" stroke="#dae7ed"/><text x="878.3333333333334" y="259" font-family="Arial,sans-serif" font-size="18" fill="#30586f" font-weight="normal">Nhấn để tạo kết quả</text><rect x="866.3333333333334" y="280" rx="8" width="360.6666666666667" height="48" fill="#fff1d6" stroke="#e2a345"/><text x="878.3333333333334" y="309" font-family="Arial,sans-serif" font-size="18" fill="#99520c" font-weight="bold">Xem trước → Lưu</text><text x="34" y="454" font-family="Arial,sans-serif" font-size="19" fill="#3a627b">Nhận xét cuối năm: Quản lý đảng viên sinh hoạt nơi cư trú → Nhận xét → Xem trước → Lưu phiếu.</text></svg>