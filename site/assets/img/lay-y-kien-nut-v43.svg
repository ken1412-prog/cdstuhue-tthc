<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 355" role="img" aria-label="Danh sách đảng viên - Nút cần bấm"><rect width="700" height="355" rx="15" fill="#f2f6fa"/><rect width="700" height="52" fill="#244765"/><text x="20" y="33" fill="#fff" font-family="Arial,sans-serif" font-weight="bold" font-size="21">Danh sách đảng viên - Nút cần bấm</text><rect x="18" y="62" width="664" height="48" rx="9" fill="white" stroke="#d8e3ec" stroke-width="1"/><text x="36" y="91" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1c3b55">Tìm kiếm       |       Làm mới</text><rect x="18" y="122" width="664" height="48" rx="9" fill="#ffe0a1" stroke="#e59d35" stroke-width="3"/><text x="36" y="151" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1c3b55">Lập danh sách lấy ý kiến nơi cư trú</text><rect x="18" y="182" width="664" height="48" rx="9" fill="white" stroke="#d8e3ec" stroke-width="1"/><text x="36" y="211" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1c3b55">Tích chọn đảng viên -&gt; Lập danh sách (n)</text><rect x="18" y="242" width="664" height="48" rx="9" fill="white" stroke="#d8e3ec" stroke-width="1"/><text x="36" y="271" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1c3b55">Kiểm tra -&gt; Lập danh sách và trình lên cấp trên</text><text x="20" y="341" fill="#5b7486" font-family="Arial,sans-serif" font-size="12">Minh họa vị trí nút theo hình giao diện của tài liệu tập huấn</text></svg>