<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1185 366"><rect width="1185" height="366" fill="#f4f8fb"/><rect width="1185" height="100" fill="#17476e"/><g font-family="Arial,sans-serif"><text x="25" y="43" font-size="27" fill="#fff" font-weight="bold">Hồ sơ TTHC · xử lý và theo dõi</text><text x="25" y="75" font-size="18" fill="#cbe9f9">V36_099 · V36_114 · V36_037</text><rect x="25" y="133" rx="14" width="272" height="153" fill="#fff" stroke="#cbd8e6" stroke-width="2"/><rect x="25" y="133" rx="14" width="272" height="50" fill="#dfeef8"/><text x="37" y="165" font-size="18" font-weight="bold" fill="#143c62">Cán bộ</text><text x="37" y="217" font-size="15" fill="#253a4e">Quản lý hồ sơ TTHC khác</text><text x="37" y="254" font-size="15" fill="#9f5017">Chờ xử lý</text><rect x="314" y="133" rx="14" width="272" height="153" fill="#fff" stroke="#cbd8e6" stroke-width="2"/><rect x="314" y="133" rx="14" width="272" height="50" fill="#dfeef8"/><text x="326" y="165" font-size="18" font-weight="bold" fill="#143c62">Hồ sơ thiếu</text><text x="326" y="217" font-size="15" fill="#253a4e">Yêu cầu bổ sung</text><text x="326" y="254" font-size="15" fill="#9f5017">Ghi rõ nội dung</text><rect x="603" y="133" rx="14" width="272" height="153" fill="#fff" stroke="#cbd8e6" stroke-width="2"/><rect x="603" y="133" rx="14" width="272" height="50" fill="#f8ead9"/><text x="615" y="165" font-size="18" font-weight="bold" fill="#143c62">Đạt / không đạt</text><text x="615" y="217" font-size="15" fill="#253a4e">Phê duyệt hay từ chối</text><text x="615" y="254" font-size="15" fill="#9f5017">Đúng quyền, đúng bước</text><rect x="892" y="133" rx="14" width="272" height="153" fill="#fff" stroke="#cbd8e6" stroke-width="2"/><rect x="892" y="133" rx="14" width="272" height="50" fill="#dfeef8"/><text x="904" y="165" font-size="18" font-weight="bold" fill="#143c62">Đảng viên</text><text x="904" y="217" font-size="15" fill="#253a4e">Hồ sơ đã nộp</text><text x="904" y="254" font-size="15" fill="#9f5017">Theo dõi trạng thái</text><text x="25" y="324" font-size="16" fill="#784313" font-weight="bold">SƠ ĐỒ VỊ TRÍ NÚT TỪ VIDEO · KHÔNG PHẢI ẢNH CHỤP HỒ SƠ THẬT</text><text x="25" y="346" font-size="13" fill="#547085">Không chứa thông tin cá nhân; kiểm tra quyền tài khoản trước khi thao tác · CDSTUHUE V36</text></g></svg>
